<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f0eb">
<meta name="description" content="친구끼리 주 3회 운동 인증">
<title>오운완</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1b19'/%3E%3Crect x='7' y='13' width='18' height='6' rx='1' fill='%23e4572e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0eb;--paper:#fbfaf7;--ink:#1c1b19;--sub:#77736b;--line:#dcd8cf;
  --accent:#e4572e;--ok:#3b7d4f;--shadow:rgba(60,48,30,.14);
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:4px 0 20px}
.label{font-size:12px;font-weight:600;color:var(--sub);margin:0 0 6px}
.muted{color:var(--sub);font-size:13px}
.ok{color:var(--ok)}.warn{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
section{padding:18px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0}
button{font:inherit;font-weight:600;font-size:15px;background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:14px 16px;width:100%;cursor:pointer;transition:transform .15s,background .2s}
button:hover{background:#34322e}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.accent{background:var(--accent)}
button.accent:hover{background:#cf4a23}
button.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.line:hover{background:var(--paper)}
button.text{background:none;color:var(--sub);padding:8px 0;width:auto;text-decoration:underline;text-underline-offset:3px}
button.small{width:auto;padding:8px 12px;font-size:13px}
button:disabled{opacity:.45}
input,select{font:inherit;width:100%;padding:12px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:4px}
.ava{width:36px;height:36px;border-radius:11px;object-fit:cover;background:#e6e1d7;display:inline-grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.ava.sm{width:22px;height:22px;border-radius:7px;font-size:11px}
.ava.lg{width:84px;height:84px;border-radius:24px;font-size:32px}
.who{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
/* 이번 주 도장판 */
.left{font-family:var(--mono);font-size:88px;font-weight:600;line-height:.9;letter-spacing:-.04em}
.left small{font-family:"IBM Plex Sans KR",sans-serif;font-size:17px;font-weight:600;letter-spacing:0;margin-left:6px}
.stamps{display:grid;grid-template-columns:1fr 1.4fr 1.4fr;gap:6px;margin-top:16px}
.stamp{border:1.5px dashed #c9c3b7;border-radius:8px;padding:10px 8px;font-size:12px;font-weight:600;color:var(--sub);text-align:center}
.stamp.on{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
/* 정보 목록 */
dl{margin:0}
dl div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
dl div:last-child{border-bottom:0}
dt{color:var(--sub)}dd{margin:0;font-family:var(--mono);font-weight:600}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 12px}
.pics img,.pics div{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#e6e1d7}
.pics div{display:grid;place-items:center;color:var(--sub);font-size:13px}
/* 단체방 타임라인 */
.day{font-family:var(--mono);font-size:12px;color:var(--sub);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.snap{position:relative;border-radius:14px;overflow:hidden;border:5px solid var(--paper);box-shadow:0 8px 20px var(--shadow);aspect-ratio:4/3;background:#ddd;margin:0 8px -12px 0;z-index:1}
.snap.l{transform:rotate(-1.2deg)}.snap.r{transform:rotate(.9deg);margin:0 0 -12px 18px}
.snap img{width:100%;height:100%;object-fit:cover;display:block}
.ov{position:absolute;inset:0;padding:12px 14px;color:#fff;background:linear-gradient(180deg,rgba(20,18,15,.38),transparent 35%,transparent 55%,rgba(20,18,15,.5));display:flex;flex-direction:column}
.ov .nm{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
.ov .tm{font-family:var(--mono);font-size:36px;font-weight:600;margin-top:auto;line-height:1;letter-spacing:-.03em}
.ov .cap{font-size:13px;font-weight:500;opacity:.9}
.flag{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px}
.react{background:var(--paper);border-radius:12px;padding:22px 14px 12px;margin:0 2px 6px 10px}
.react p{margin:5px 0;font-size:14px;line-height:1.5}
.react form{display:flex;gap:6px;margin-top:8px}
.react input{margin:0;padding:9px 11px;font-size:14px}
.react form button{width:auto;padding:0 14px;font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1}
.tile img{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:8px;bottom:6px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tile .num{font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav a{flex:0 1 115px;text-align:center;padding:15px 0 13px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;border-top:2px solid transparent;margin-top:-1px;transition:color .2s}
nav a.on{color:var(--ink);border-top-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:14px;display:none;max-width:90%;z-index:10}
/* 공지 */
.notice{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0}
.notice b{font-weight:700}.notice .to{color:var(--accent);font-weight:700}
.notice .body{font-size:16px;font-weight:600;margin:2px 0}
.composer{display:grid;grid-template-columns:1fr;gap:0;margin-top:12px}
.pop{position:fixed;inset:0;background:rgba(28,27,25,.72);display:grid;place-items:center;padding:24px;z-index:20}
.pop div{background:var(--paper);border-radius:14px;padding:26px 22px 18px;max-width:380px;width:100%;border-top:6px solid var(--accent);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pop .body{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.3;margin:8px 0 18px;word-break:keep-all}
.login{min-height:80dvh;display:flex;flex-direction:column;justify-content:center}
.login h1{font-size:40px;margin:0}
</style>
</head>
<body>
<main id="app"><p class="muted">불러오는 중</p></main>
<nav id="nav" hidden>
  <a href="#home">홈</a><a href="#feed">단체방</a><a href="#members">멤버</a><a href="#me">내 정보</a>
</nav>
<div id="toast" role="status"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';
import { summarize, weekStart } from './rules.js';

// Supabase > Settings > API Keys 의 publishable 키 (브라우저 공개용, RLS로 보호)
const SUPABASE_URL = 'https://ihbwffqdhjhjnwtyytsm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xM4r7niqDRbcb40AXIMHAg_xjHV0ZXp';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const won = n => n.toLocaleString('ko-KR') + '원';
const KIND = { cardio: '유산소', strength: '근력' };
const hhmm = d => new Date(d).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
const dayLabel = d => new Date(d).toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit', weekday: 'short' });
let me, profiles = [], workouts = [], comments = [], notices = [], canNotice = false, fine = 10000;

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2500);
}
const prof = id => profiles.find(p => p.id === id);
const nick = id => prof(id)?.nickname ?? '?';
const ava = (p, cls = '') => p?.avatar
  ? `<img class="ava ${cls}" src="${esc(p.avatar)}" alt="${esc(p.nickname)} 프로필">`
  : `<span class="ava ${cls}" aria-hidden="true">${esc((p?.nickname ?? '?')[0])}</span>`;
const who = id => `<a class="who" href="#u/${id}">${ava(prof(id))}${esc(nick(id))}</a>`;
const check = r => { if (r.error) throw r.error; return r.data; };
// 버튼 액션 공통: 실패하면 토스트
const act = fn => async e => {
  const b = e?.currentTarget; if (b) b.disabled = true;
  try { await fn(e); } catch (err) { toast(err.message ?? String(err)); } finally { if (b) b.disabled = false; }
};

// 사진 리사이즈(긴 변 1280) 후 업로드, 공개 URL 반환
async function upload(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: img.width * s, height: img.height * s });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  const path = `${me.id}/${crypto.randomUUID()}.jpg`;
  check(await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' }));
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
}
// camera=true: 폰에서 바로 카메라 (운동 인증용), false: 앨범 선택 허용
const pickPhoto = (camera = true) => new Promise(res => {
  const i = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' });
  if (camera) i.setAttribute('capture', 'environment');
  i.onchange = () => res(i.files[0]);
  i.click();
});

async function load() {
  const week = new Date(Date.now() - 7 * 864e5).toISOString();
  const [p, w, c, s, n, cn] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('workouts').select('*').order('created_at', { ascending: false }),
    sb.from('comments').select('*').order('created_at'),
    sb.from('settings').select('fine').single(),
    sb.from('notices').select('*').gte('created_at', week).order('created_at', { ascending: false }),
    sb.rpc('can_notice'),
  ]);
  profiles = check(p); workouts = check(w); comments = check(c); fine = check(s).fine;
  notices = check(n); canNotice = check(cn);
  me = profiles.find(x => x.id === me.id) ?? { id: me.id };
}
const statsOf = p => summarize(workouts.filter(w => w.user_id === p.id && w.approved_by), p.created_at);

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  me = { id: session.user.id };
  await load();
  if (!me.nickname) return nicknameView();
  $('#nav').hidden = false;
  route();
  popNotice();
}

// 나한테 온(또는 전체) 안 본 공지 중 최신 1개를 화면 가득 띄움
function popNotice() {
  let seen = 0;
  try { seen = +localStorage.getItem('seenNotice') || 0; } catch {}
  const n = notices.find(n => n.id > seen && n.user_id !== me.id && (!n.target || n.target === me.id));
  if (!n) return;
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = `<div role="dialog" aria-label="공지"><p class="label">${esc(nick(n.user_id))}${prof(n.user_id)?.is_admin ? ' (관리자)' : ''} → ${n.target ? '너' : '전체'}</p>
    <p class="body">${esc(n.body)}</p><button>알겠음</button></div>`;
  el.querySelector('button').onclick = () => { try { localStorage.setItem('seenNotice', notices[0].id); } catch {} el.remove(); };
  document.body.append(el);
}

function noticeSection() {
  const recent = notices.slice(0, 5);
  return `<section><p class="label">공지</p>
    ${recent.map(n => `<div class="notice"><span class="muted">${esc(nick(n.user_id))} → <span class="to">${n.target ? esc(nick(n.target)) : '전체'}</span> · <span class="num">${hhmm(n.created_at)}</span></span>
      <p class="body">${esc(n.body)}</p></div>`).join('') || '<p class="muted">이번 주 공지 없음</p>'}
    ${canNotice ? `<form class="composer" id="noticeForm">
        <select id="nTarget" aria-label="받는 사람"><option value="">전체</option>${profiles.filter(p => p.id !== me.id).map(p => `<option value="${p.id}">${esc(p.nickname)}</option>`).join('')}</select>
        <input id="nBody" maxlength="80" placeholder="예: 에몽가 돼지 공부좀 해라 ㅋㅋ" required>
        <button class="line">공지 띄우기</button></form>`
      : '<p class="muted">지난주 3회 채운 사람만 공지 쓸 수 있음.</p>'}</section>`;
}
function bindNotice(rerender) {
  const f = $('#noticeForm'); if (!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    act(async () => {
      check(await sb.from('notices').insert({ target: $('#nTarget').value || null, body: $('#nBody').value.trim() }));
      await load(); rerender(); toast('띄움');
    })({ currentTarget: f.querySelector('button') });
  };
}

function loginView() {
  $('#nav').hidden = true;
  app.innerHTML = `<div class="login"><h1>오운완</h1>
    <p class="muted" style="margin:6px 0 28px">주 3회. 못 하면 만원.</p>
    <form id="loginForm">
    <input id="email" type="email" placeholder="이메일" autocomplete="email" required>
    <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" required minlength="6">
    <button id="login">로그인</button>
    <button type="button" class="line" id="signup" style="margin-top:8px">처음이면 가입하기</button>
    <p class="muted" style="margin-top:18px">비밀번호를 잊었으면 관리자한테 말하면 임시 비밀번호로 바꿔줌.</p></form></div>`;
  const cred = () => ({ email: $('#email').value.trim(), password: $('#pw').value });
  const login = act(async () => { check(await sb.auth.signInWithPassword(cred())); await boot(); });
  $('#loginForm').onsubmit = e => { e.preventDefault(); login({ currentTarget: $('#login') }); };
  $('#signup').onclick = act(async () => {
    const r = check(await sb.auth.signUp(cred()));
    if (!r.session) throw new Error('Supabase에서 이메일 인증(Confirm email)을 꺼야 함');
    await boot();
  });
}

function nicknameView() {
  app.innerHTML = `<h1>닉네임</h1><p class="muted">단체방에 보일 이름</p>
    <input id="nick" placeholder="예: 몽글" maxlength="12"><button id="save">시작</button>`;
  $('#save').onclick = act(async () => {
    const nickname = $('#nick').value.trim();
    if (!nickname) throw new Error('닉네임을 입력해줘');
    check(await sb.from('profiles').insert({ id: me.id, nickname }));
    await boot();
  });
}

function route() {
  const page = location.hash.slice(1) || 'home';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + page));
  if (page.startsWith('u/')) return profile(page.slice(2));
  ({ home, feed, members, me: mePage }[page] ?? home)();
}
window.onhashchange = route;

// 유산소 1칸 + 근력 2칸 도장판
const stamps = w => `<div class="stamps">
  <div class="stamp ${w.cardio >= 1 ? 'on' : ''}">유산소</div>
  <div class="stamp ${w.strength >= 1 ? 'on' : ''}">근력 1</div>
  <div class="stamp ${w.strength >= 2 ? 'on' : ''}">근력 2</div></div>`;

function home() {
  const s = statsOf(me);
  const thisWeek = weekStart(new Date());
  const mine = workouts.filter(w => w.user_id === me.id && new Date(w.created_at) >= thisWeek);
  const ongoing = mine.find(w => !w.end_photo);
  const pending = mine.filter(w => w.end_photo && !w.approved_by).length;
  const toApprove = workouts.filter(w => w.user_id !== me.id && w.end_photo && !w.approved_by).length;
  app.innerHTML = `<div class="row" style="margin-bottom:18px">${who(me.id)}<span class="muted num">${dayLabel(new Date())}</span></div>
    <section><p class="label">이번 주 남은 횟수</p>
      <div class="left">${s.week.left}<small>${s.week.left ? '회' : '회 · 이번 주 끝'}</small></div>
      ${stamps(s.week)}
      ${pending ? `<p class="muted" style="margin:12px 0 0">확인 대기 ${pending}건. 친구가 확인해야 도장 찍힘.</p>` : ''}</section>
    <section>${ongoing
      ? `<p class="label">운동 중 · ${KIND[ongoing.kind]} · <span class="num">${hhmm(ongoing.created_at)}</span> 시작</p>
         <div class="pics"><img src="${esc(ongoing.start_photo)}" alt="시작 사진"><div>끝 사진</div></div>
         <button class="accent" id="finish">끝 사진 찍기</button>
         <button class="text" id="cancel">이번 운동 취소</button>`
      : `<p class="label">운동 시작</p>
         <select id="kind" aria-label="운동 종류"><option value="strength">근력</option><option value="cardio">유산소</option></select>
         <button class="accent" id="start">시작 사진 찍기</button>`}</section>
    <section><dl>
      <div><dt>남은 쿠폰 (이번 분기)</dt><dd>${s.couponsLeft} / 3</dd></div>
      <div><dt>내 벌금</dt><dd class="${s.misses ? 'warn' : ''}">${won(s.misses * fine)}</dd></div>
      <div><dt>내가 확인해줄 인증</dt><dd>${toApprove}건</dd></div></dl>
      ${toApprove ? `<button class="line" style="margin-top:12px" onclick="location.hash='feed'">단체방에서 확인하기</button>` : ''}</section>
    ${noticeSection()}`;
  bindNotice(home);
  if (ongoing) {
    $('#finish').onclick = act(async () => {
      const f = await pickPhoto(); if (!f) return;
      toast('올리는 중');
      check(await sb.from('workouts').update({ end_photo: await upload(f), ended_at: new Date().toISOString() }).eq('id', ongoing.id));
      toast('올림. 친구 확인 기다리는 중'); await load(); home();
    });
    $('#cancel').onclick = act(async () => {
      check(await sb.from('workouts').delete().eq('id', ongoing.id)); await load(); home();
    });
  } else {
    $('#start').onclick = act(async () => {
      const kind = $('#kind').value, f = await pickPhoto(); if (!f) return;
      toast('올리는 중');
      check(await sb.from('workouts').insert({ kind, start_photo: await upload(f) }));
      toast('시작함. 끝나면 끝 사진'); await load(); home();
    });
  }
}

// 시작/끝 사진 한 장 = 스냅 카드 한 장
function snap(w, end) {
  const t = end ? (w.ended_at ?? w.created_at) : w.created_at;
  return `<article class="snap ${end ? 'r' : 'l'}"><img src="${esc(end ? w.end_photo : w.start_photo)}" loading="lazy" alt="${esc(nick(w.user_id))} ${KIND[w.kind]} ${end ? '끝' : '시작'} 사진">
    <div class="ov"><span class="nm">${ava(prof(w.user_id), 'sm')}${esc(nick(w.user_id))}</span>
      <b class="tm">${hhmm(t)}</b><span class="cap">${KIND[w.kind]} ${end ? '끝' : '시작'}</span></div>
    ${!end && !w.end_photo ? '<span class="flag">운동 중</span>' : ''}</article>`;
}
// 끝 카드 아래: 확인 + 한마디
function reactBox(w) {
  const cs = comments.filter(c => c.workout_id === w.id);
  return `<div class="react">
    ${w.approved_by ? `<p class="ok"><b>${esc(nick(w.approved_by))}</b> 확인함</p>`
      : w.user_id === me.id ? `<p class="muted">친구 확인 기다리는 중</p>`
      : `<button class="accent small" data-ok="${w.id}">확인해주기</button>`}
    ${cs.map(c => `<p><b>${esc(nick(c.user_id))}</b> ${esc(c.body)}</p>`).join('')}
    <form data-cmt="${w.id}"><input maxlength="60" placeholder="한마디" aria-label="한마디" required><button>보내기</button></form></div>`;
}

function feed() {
  // ponytail: 최근 30개 운동만, 무한 스크롤은 필요해지면
  const ev = workouts.slice(0, 30).flatMap(w => [
    { w, end: false, t: w.created_at },
    ...(w.end_photo ? [{ w, end: true, t: w.ended_at ?? w.created_at }] : []),
  ]).sort((a, b) => new Date(b.t) - new Date(a.t));
  let lastDay = '', html = '<h1>단체방</h1>';
  for (const e of ev) {
    const d = dayLabel(e.t);
    if (d !== lastDay) { html += `<div class="day">${d}</div>`; lastDay = d; }
    html += snap(e.w, e.end) + (e.end ? reactBox(e.w) : '<div style="height:20px"></div>');
  }
  app.innerHTML = ev.length ? html : html + '<p class="muted">아직 아무도 안 올림. 홈에서 시작 사진 찍으면 여기 뜸.</p>';
  bindReact(feed);
}
function bindReact(rerender) {
  app.querySelectorAll('[data-ok]').forEach(b => b.onclick = act(async () => {
    check(await sb.rpc('approve', { wid: +b.dataset.ok })); await load(); rerender();
  }));
  app.querySelectorAll('[data-cmt]').forEach(f => f.onsubmit = e => {
    e.preventDefault();
    act(async () => {
      check(await sb.from('comments').insert({ workout_id: +f.dataset.cmt, body: f.querySelector('input').value.trim() }));
      await load(); rerender();
    })({ currentTarget: f.querySelector('button') });
  });
}

function profile(id) {
  const p = prof(id);
  if (!p) return home();
  const s = statsOf(p);
  const done = workouts.filter(w => w.user_id === id && w.end_photo);
  app.innerHTML = `<button class="text" onclick="history.back()">← 뒤로</button>
    <section style="display:flex;gap:16px;align-items:center">${ava(p, 'lg')}
      <div><h1 style="margin:0 0 4px">${esc(p.nickname)}</h1>
      <p class="muted num" style="margin:0">${p.current_weight ? `${p.current_weight}kg${p.target_weight ? ` → ${p.target_weight}kg` : ''}` : '체중 미입력'}</p></div></section>
    <section><p class="label">이번 주</p>${stamps(s.week)}
      <dl style="margin-top:10px"><div><dt>총 인증</dt><dd>${done.length}회</dd></div>
      <div><dt>벌금</dt><dd class="${s.misses ? 'warn' : ''}">${won(s.misses * fine)}</dd></div></dl></section>
    <section><p class="label">기록</p>
    <div class="tiles">${done.map(w => `<div class="tile"><img src="${esc(w.end_photo)}" loading="lazy" alt="${KIND[w.kind]} 인증 사진">
      <span><span class="num">${new Date(w.created_at).toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' })}</span> ${KIND[w.kind]}${w.approved_by ? ' · 확인됨' : ''}</span></div>`).join('')
      || '<p class="muted">아직 기록 없음</p>'}</div></section>`;
}

function members() {
  const rows = profiles.map(p => ({ p, s: statsOf(p) }));
  const pot = rows.reduce((a, r) => a + r.s.misses * fine, 0);
  app.innerHTML = `<h1>멤버</h1>
    <section><p class="label">벌금통</p><div class="left" style="font-size:52px">${pot.toLocaleString('ko-KR')}<small>원</small></div>
      <p class="muted">미달 1회당 ${won(fine)}</p></section>
    <section>${rows.map(({ p, s }) => `<div class="row" style="padding:10px 0">${who(p.id)}
      <span class="num ${s.week.left ? '' : 'ok'}" style="font-size:14px">${s.week.left ? `${s.week.left}회 남음` : '이번 주 끝'}${s.misses ? ` · <span class="warn">${won(s.misses * fine)}</span>` : ''}</span></div>`).join('')}</section>
    ${me.is_admin ? `<section><p class="label">관리자 · 벌금 금액</p><input id="fine" type="number" step="1000" value="${fine}"><button class="line" id="saveFine">저장</button></section>
    <section><p class="label">관리자 · 비밀번호 초기화</p>
      <select id="resetWho">${profiles.map(p => `<option value="${p.id}">${esc(p.nickname)}</option>`).join('')}</select>
      <input id="resetPw" placeholder="임시 비밀번호 (6자 이상)" autocomplete="off">
      <button class="line" id="resetBtn">초기화</button></section>` : ''}`;
  if (me.is_admin) {
    $('#saveFine').onclick = act(async () => {
      check(await sb.from('settings').update({ fine: +$('#fine').value }).eq('id', 1));
      await load(); members(); toast('저장됨');
    });
    $('#resetBtn').onclick = act(async () => {
      check(await sb.rpc('admin_reset_password', { uid: $('#resetWho').value, pw: $('#resetPw').value }));
      $('#resetPw').value = ''; toast('바꿈. 임시 비밀번호 알려주면 됨');
    });
  }
}

function mePage() {
  app.innerHTML = `<h1>내 정보</h1>
    <section style="display:flex;gap:16px;align-items:center">${ava(me, 'lg')}
      <div><button class="line small" id="avatar">사진 바꾸기</button>
      <a class="muted" href="#u/${me.id}" style="display:block;margin-top:10px">내 기록 보기 →</a></div></section>
    <section>
    <label for="nick">닉네임</label><input id="nick" value="${esc(me.nickname)}" maxlength="12">
    <label for="tw">목표 체중 (kg)</label><input id="tw" type="number" step="0.1" value="${me.target_weight ?? ''}">
    <label for="cw">현재 체중 (kg)</label><input id="cw" type="number" step="0.1" value="${me.current_weight ?? ''}">
    <label>체중계 사진</label>
    ${me.weight_photo ? `<img src="${esc(me.weight_photo)}" alt="체중계 사진" style="width:100%;border-radius:8px;margin-bottom:10px">` : ''}
    <button class="line" id="wphoto">체중계 사진 찍기</button>
    <button id="save" style="margin-top:8px">저장</button></section>
    <section><label for="newPw">비밀번호 변경</label>
      <input id="newPw" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password">
      <button class="line" id="changePw">변경</button></section>
    <section><button class="text" id="logout">로그아웃</button></section>`;
  const num = v => v === '' ? null : +v;
  $('#avatar').onclick = act(async () => {
    const f = await pickPhoto(false); if (!f) return;
    toast('올리는 중');
    check(await sb.from('profiles').update({ avatar: await upload(f) }).eq('id', me.id));
    await load(); mePage();
  });
  $('#wphoto').onclick = act(async () => {
    const f = await pickPhoto(); if (!f) return;
    toast('올리는 중');
    check(await sb.from('profiles').update({ weight_photo: await upload(f) }).eq('id', me.id));
    await load(); mePage();
  });
  $('#save').onclick = act(async () => {
    check(await sb.from('profiles').update({ nickname: $('#nick').value.trim() || me.nickname, target_weight: num($('#tw').value), current_weight: num($('#cw').value) }).eq('id', me.id));
    await load(); toast('저장됨');
  });
  $('#changePw').onclick = act(async () => {
    check(await sb.auth.updateUser({ password: $('#newPw').value }));
    $('#newPw').value = ''; toast('비밀번호 바뀜');
  });
  $('#logout').onclick = act(async () => { await sb.auth.signOut(); boot(); });
}

boot().catch(e => { app.innerHTML = `<p class="warn">${esc(e.message)}</p><p class="muted">연결 실패. 새로고침 해보고 계속 안 되면 관리자한테 말해줘.</p>`; });
</script>
</body>
</html>
