<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe7">
<title>오운완</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe7;--card:#fffdf9;--line:#e7dfd3;--text:#2d2833;--sub:#8b8394;--lav:#a98bf5;--lav2:#ece4ff;--yel:#ffd76a;--pink:#ff8fab;--mint:#7ad9b5;--warn:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:480px;margin:0 auto;padding:16px 16px 100px}
h1,.big,.tm,.jua{font-family:Jua,system-ui,sans-serif;font-weight:400}
h1{font-size:26px;margin:8px 0 16px}
h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.big{font-size:42px;color:var(--lav);line-height:1.1}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:20px;font-family:Jua,sans-serif;font-weight:400}
button{background:var(--lav);color:#fff;border:0;border-radius:16px;padding:13px 16px;font-weight:700;font-size:15px;width:100%;cursor:pointer;box-shadow:0 3px 0 #8466d9}
button:active{transform:translateY(2px);box-shadow:none}
button.ghost{background:var(--card);color:var(--text);border:2px solid var(--line);box-shadow:none}
button.small{width:auto;padding:8px 12px;font-size:13px}
button.yel{background:var(--yel);color:var(--text);box-shadow:0 3px 0 #e0b443}
button:disabled{opacity:.5}
input,select{width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--text);font-size:16px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--lav2);color:#6d4fd1;font-weight:700}
.ok{color:#2fae7e}.warn{color:var(--warn)}.muted{color:var(--sub);font-size:13px}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--yel);display:inline-grid;place-items:center;font-weight:700;flex:none;border:2px solid #fff}
.ava.sm{width:24px;height:24px;font-size:12px}
.ava.lg{width:92px;height:92px;font-size:34px}
.who{display:flex;gap:8px;align-items:center;color:inherit;text-decoration:none}
/* 타임라인 스냅 카드 */
.day{font-family:Jua,sans-serif;text-align:center;color:var(--sub);margin:22px 0 10px}
.snap{position:relative;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 18px rgba(80,60,40,.12);aspect-ratio:4/3;background:#ddd;margin:0 6px -14px;z-index:1}
.snap.l{transform:rotate(-1.6deg)}.snap.r{transform:rotate(1.4deg);margin-left:22px}
.snap img{width:100%;height:100%;object-fit:cover;display:block}
.ov{position:absolute;inset:0;padding:12px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 40%,transparent 60%,rgba(0,0,0,.35));display:flex;flex-direction:column}
.ov .nm{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700}
.ov .tm{font-size:38px;margin-top:auto;line-height:1}
.ov .cap{font-size:14px;font-weight:700}
.badge{position:absolute;top:10px;right:10px;background:var(--yel);color:var(--text);font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px}
.react{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px 14px 12px;margin:0 4px 8px}
.react p{margin:6px 0;font-size:14px}
.react form{display:flex;gap:6px;margin-top:8px}
.react input{margin:0;padding:9px 12px;font-size:14px}
.react form button{width:auto;padding:0 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;border:3px solid #fff;box-shadow:0 3px 10px rgba(80,60,40,.1)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:8px;bottom:6px;color:#fff;font-family:Jua,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.pics img,.pics div{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--lav2)}
.pics div{display:grid;place-items:center;color:var(--sub);font-size:13px}
nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));display:flex;background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 20px rgba(80,60,40,.12);margin-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav a{flex:1;text-align:center;padding:12px 0;color:var(--sub);text-decoration:none;font-size:13px;font-weight:700}
nav a.on{color:var(--lav)}
/* 공지 */
.notice{position:relative;background:var(--lav2);border-radius:16px;padding:10px 40px 10px 14px;margin:8px 0}
.notice .x{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border-radius:50%;background:transparent;color:var(--warn);box-shadow:none;font-size:16px;font-weight:800}
.notice .x:hover{background:#fff}
.notice .body{font-size:16px;font-weight:700;margin:2px 0}
.notice .to{color:#6d4fd1;font-weight:700}
.pop{position:fixed;inset:0;background:rgba(45,40,51,.55);display:grid;place-items:center;padding:24px;z-index:20}
.pop>div{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:26px 22px 20px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(45,40,51,.25)}
.pop .body{font-family:Jua,sans-serif;font-size:30px;line-height:1.25;margin:10px 0 20px;word-break:keep-all}
/* 공지: 화면 전체 덮고 스르르 사라짐 */
.cover{position:fixed;inset:0;z-index:20;background:var(--pink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:32px;text-align:center;animation:cover 3.8s ease forwards;cursor:pointer}
.cover .from{font-weight:700;opacity:.85;margin:0}
.cover .body{font-family:Jua,sans-serif;font-size:clamp(38px,11vw,68px);line-height:1.15;margin:14px 0;word-break:keep-all;animation:wiggle .5s ease-in-out 3}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.04)}75%{transform:rotate(3deg) scale(1.04)}}
.cover .skip{font-size:13px;opacity:.7;margin:0}
@keyframes cover{0%{opacity:0;transform:scale(1.08)}12%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0;visibility:hidden}}
/* 홈 */
.kg{display:block;font-size:24px}
.spark{width:100%;height:auto;margin:10px 0 4px}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 32px));text-align:center;font-family:Jua,sans-serif;font-size:24px;padding:16px;border-radius:20px;background:var(--lav);color:#fff;text-decoration:none;box-shadow:0 5px 0 #8466d9,0 12px 26px rgba(120,90,200,.3);z-index:5}
.cta:active{transform:translate(-50%,3px);box-shadow:0 2px 0 #8466d9}
main{padding-bottom:170px}
/* 단체방 로그/채팅 */
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;margin-bottom:8px}
.seg button{background:transparent;color:var(--sub);box-shadow:none;padding:9px}
.seg button.on{background:var(--lav);color:#fff}
.rp{position:absolute;right:10px;bottom:10px;width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.85);color:var(--text);box-shadow:none;font-size:16px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:50px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.who-s{font-size:12px;color:var(--sub);margin:0 0 3px;font-weight:700}
.time{font-size:11px;color:var(--sub);flex:none}
.bub{background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 13px;font-size:15px;line-height:1.45;word-break:break-word}
.mine .bub{background:var(--lav);border-color:var(--lav);color:#fff;border-radius:18px 18px 6px 18px}
.ph{position:relative;width:min(230px,60vw);border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(80,60,40,.12)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph span{position:absolute;left:9px;bottom:7px;color:#fff;font-family:Jua,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph .rp{width:30px;height:30px;right:7px;bottom:7px;font-size:14px}
.quote{display:flex;gap:8px;align-items:center;font-size:12px;opacity:.85;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(127,127,127,.3)}
.quote img{width:40px;height:30px;object-fit:cover;border-radius:6px}
.chatbar{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px;z-index:5;box-shadow:0 6px 20px rgba(80,60,40,.12)}
.chatbar input{margin:0;border:0;background:transparent}
.chatbar .row>button{width:44px;height:40px;padding:0;flex:none;border-radius:14px}
.replying{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);padding:4px 6px 8px;position:relative}
.replying img{width:36px;height:27px;object-fit:cover;border-radius:6px}
.replying .x{position:absolute;right:2px;top:0;width:26px;height:26px;padding:0;background:transparent;color:var(--sub);box-shadow:none}
/* 이모지 반응, 채팅 사진 */
.rx{display:flex;gap:5px;flex-wrap:wrap;padding:20px 4px 6px}
.rxb{width:auto;padding:4px 9px;border-radius:99px;background:var(--card);border:2px solid var(--line);color:var(--text);box-shadow:none;font-size:15px;font-weight:700;line-height:1.3}
.rxb.on{background:var(--lav2);border-color:var(--lav)}
.rxb b{font-size:12px}
.msg .rx{padding:5px 0 0;gap:4px}
.msg .rxb{padding:1px 6px;font-size:12px}
.cimg{display:block;width:min(220px,58vw);border-radius:12px;margin-top:4px}
.chatbar .row>button.pic{background:transparent;color:var(--text);box-shadow:none;font-size:20px}
/* 방 */
.roombar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.roombar select{margin:0;width:auto;max-width:65%;font-weight:700;padding:8px 12px;border-radius:12px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:15px;color:var(--text)}
.chk input{width:auto;margin:0}
.chk .muted{margin-left:auto}
details summary{cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:none;max-width:90%;z-index:9}
</style>
</head>
<body>
<main id="app"><p class="muted">불러오는 중…</p></main>
<nav id="nav" hidden>
  <a href="#home">홈</a><a href="#feed">단체방</a><a href="#members">멤버</a><a href="#me">내 정보</a>
</nav>
<div id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
