<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe7">
<title>오운완</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe7;--card:#fffdf9;--line:#e7dfd3;--text:#2d2833;--sub:#8b8394;--lav:#a98bf5;--lav2:#ece4ff;--yel:#ffd76a;--pink:#ff8fab;--mint:#7ad9b5;--warn:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:480px;margin:0 auto;padding:16px 16px 100px}
h1,.big,.tm,.jua{font-family:Jua,system-ui,sans-serif;font-weight:400}
h1{font-size:26px;margin:8px 0 16px}
h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.big{font-size:42px;color:var(--lav);line-height:1.1}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:20px;font-family:Jua,sans-serif;font-weight:400}
button{background:var(--lav);color:#fff;border:0;border-radius:16px;padding:13px 16px;font-weight:700;font-size:15px;width:100%;cursor:pointer;box-shadow:0 3px 0 #8466d9}
button:active{transform:translateY(2px);box-shadow:none}
button.ghost{background:var(--card);color:var(--text);border:2px solid var(--line);box-shadow:none}
button.small{width:auto;padding:8px 12px;font-size:13px}
button.yel{background:var(--yel);color:var(--text);box-shadow:0 3px 0 #e0b443}
button:disabled{opacity:.5}
input,select{width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--text);font-size:16px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--lav2);color:#6d4fd1;font-weight:700}
.ok{color:#2fae7e}.warn{color:var(--warn)}.muted{color:var(--sub);font-size:13px}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--yel);display:inline-grid;place-items:center;font-weight:700;flex:none;border:2px solid #fff}
.ava.sm{width:24px;height:24px;font-size:12px}
.ava.lg{width:92px;height:92px;font-size:34px}
.who{display:flex;gap:8px;align-items:center;color:inherit;text-decoration:none}
/* 타임라인 스냅 카드 */
.day{font-family:Jua,sans-serif;text-align:center;color:var(--sub);margin:22px 0 10px}
.snap{position:relative;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 18px rgba(80,60,40,.12);aspect-ratio:4/3;background:#ddd;margin:0 6px -14px;z-index:1}
.snap.l{transform:rotate(-1.6deg)}.snap.r{transform:rotate(1.4deg);margin-left:22px}
.snap img{width:100%;height:100%;object-fit:cover;display:block}
.ov{position:absolute;inset:0;padding:12px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 40%,transparent 60%,rgba(0,0,0,.35));display:flex;flex-direction:column}
.ov .nm{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700}
.ov .tm{font-size:38px;margin-top:auto;line-height:1}
.ov .cap{font-size:14px;font-weight:700}
.badge{position:absolute;top:10px;right:10px;background:var(--yel);color:var(--text);font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px}
.react{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px 14px 12px;margin:0 4px 8px}
.react p{margin:6px 0;font-size:14px}
.react form{display:flex;gap:6px;margin-top:8px}
.react input{margin:0;padding:9px 12px;font-size:14px}
.react form button{width:auto;padding:0 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;border:3px solid #fff;box-shadow:0 3px 10px rgba(80,60,40,.1)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:8px;bottom:6px;color:#fff;font-family:Jua,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.pics img,.pics div{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--lav2)}
.pics div{display:grid;place-items:center;color:var(--sub);font-size:13px}
nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));display:flex;background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 20px rgba(80,60,40,.12);margin-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav a{flex:1;text-align:center;padding:12px 0;color:var(--sub);text-decoration:none;font-size:13px;font-weight:700}
nav a.on{color:var(--lav)}
/* 공지 */
.notice{position:relative;background:var(--lav2);border-radius:16px;padding:10px 40px 10px 14px;margin:8px 0}
.notice .x{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border-radius:50%;background:transparent;color:var(--warn);box-shadow:none;font-size:16px;font-weight:800}
.notice .x:hover{background:#fff}
.notice .body{font-size:16px;font-weight:700;margin:2px 0}
.notice .to{color:#6d4fd1;font-weight:700}
.pop{position:fixed;inset:0;background:rgba(45,40,51,.55);display:grid;place-items:center;padding:24px;z-index:20}
.pop>div{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:26px 22px 20px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(45,40,51,.25)}
.pop .body{font-family:Jua,sans-serif;font-size:30px;line-height:1.25;margin:10px 0 20px;word-break:keep-all}
/* 공지: 화면 전체 덮고 스르르 사라짐 */
.cover{position:fixed;inset:0;z-index:20;background:var(--pink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:32px;text-align:center;animation:cover 3.8s ease forwards;cursor:pointer}
.cover .from{font-weight:700;opacity:.85;margin:0}
.cover .body{font-family:Jua,sans-serif;font-size:clamp(38px,11vw,68px);line-height:1.15;margin:14px 0;word-break:keep-all;animation:wiggle .5s ease-in-out 3}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.04)}75%{transform:rotate(3deg) scale(1.04)}}
.cover .skip{font-size:13px;opacity:.7;margin:0}
@keyframes cover{0%{opacity:0;transform:scale(1.08)}12%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0;visibility:hidden}}
/* 홈 */
.kg{display:block;font-size:24px}
.spark{width:100%;height:auto;margin:10px 0 4px}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 32px));text-align:center;font-family:Jua,sans-serif;font-size:24px;padding:16px;border-radius:20px;background:var(--lav);color:#fff;text-decoration:none;box-shadow:0 5px 0 #8466d9,0 12px 26px rgba(120,90,200,.3);z-index:5}
.cta:active{transform:translate(-50%,3px);box-shadow:0 2px 0 #8466d9}
main{padding-bottom:170px}
/* 단체방 로그/채팅 */
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;margin-bottom:8px}
.seg button{background:transparent;color:var(--sub);box-shadow:none;padding:9px}
.seg button.on{background:var(--lav);color:#fff}
.rp{position:absolute;right:10px;bottom:10px;width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.85);color:var(--text);box-shadow:none;font-size:16px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:50px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.who-s{font-size:12px;color:var(--sub);margin:0 0 3px;font-weight:700}
.time{font-size:11px;color:var(--sub);flex:none}
.bub{background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 13px;font-size:15px;line-height:1.45;word-break:break-word}
.mine .bub{background:var(--lav);border-color:var(--lav);color:#fff;border-radius:18px 18px 6px 18px}
.ph{position:relative;width:min(230px,60vw);border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(80,60,40,.12)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph span{position:absolute;left:9px;bottom:7px;color:#fff;font-family:Jua,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph .rp{width:30px;height:30px;right:7px;bottom:7px;font-size:14px}
.quote{display:flex;gap:8px;align-items:center;font-size:12px;opacity:.85;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(127,127,127,.3)}
.quote img{width:40px;height:30px;object-fit:cover;border-radius:6px}
.chatbar{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px;z-index:5;box-shadow:0 6px 20px rgba(80,60,40,.12)}
.chatbar input{margin:0;border:0;background:transparent}
.chatbar .row>button{width:44px;height:40px;padding:0;flex:none;border-radius:14px}
.replying{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);padding:4px 6px 8px;position:relative}
.replying img{width:36px;height:27px;object-fit:cover;border-radius:6px}
.replying .x{position:absolute;right:2px;top:0;width:26px;height:26px;padding:0;background:transparent;color:var(--sub);box-shadow:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:none;max-width:90%;z-index:9}
</style>
</head>
<body>
<main id="app"><p class="muted">불러오는 중…</p></main>
<nav id="nav" hidden>
  <a href="#home">홈</a><a href="#feed">단체방</a><a href="#members">멤버</a><a href="#me">내 정보</a>
</nav>
<div id="toast"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';
import { summarize, weekStart, totalMinutes, buddy } from './rules.js';

// Supabase > Settings > API Keys 의 publishable 키 (브라우저 공개용, RLS로 보호)
const SUPABASE_URL = 'https://ihbwffqdhjhjnwtyytsm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xM4r7niqDRbcb40AXIMHAg_xjHV0ZXp';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const won = n => n.toLocaleString('ko-KR') + '원';
const KIND = { cardio: '유산소', strength: '근력' };
const hhmm = d => new Date(d).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
const dayLabel = d => new Date(d).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
let me, profiles = [], workouts = [], comments = [], notices = [], weights = [], pokes = [], chatMsgs = [], canNotice = false, fine = 10000;
const today = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD (로컬)

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2500);
}
const prof = id => profiles.find(p => p.id === id);
const nick = id => prof(id)?.nickname ?? '?';
const ava = (p, cls = '') => p?.avatar
  ? `<img class="ava ${cls}" src="${esc(p.avatar)}" alt="">`
  : `<span class="ava ${cls}">${esc((p?.nickname ?? '?')[0])}</span>`;
const who = id => `<a class="who" href="#u/${id}">${ava(prof(id))}<b>${esc(nick(id))}</b></a>`;
const check = r => { if (r.error) throw r.error; return r.data; };
// 버튼 액션 공통: 실패하면 토스트
const act = fn => async e => {
  const b = e?.currentTarget; if (b) b.disabled = true;
  try { await fn(e); } catch (err) { toast(err.message ?? String(err)); } finally { if (b) b.disabled = false; }
};

// 사진 리사이즈(긴 변 1280) 후 업로드, 공개 URL 반환
async function upload(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: img.width * s, height: img.height * s });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  const path = `${me.id}/${crypto.randomUUID()}.jpg`;
  check(await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' }));
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
}
// camera=true: 폰에서 바로 카메라 (운동 인증용), false: 앨범 선택 허용
const pickPhoto = (camera = true) => new Promise(res => {
  const i = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' });
  if (camera) i.setAttribute('capture', 'environment');
  // 화면에 붙여둬야 안드로이드에서 선택 후 change가 확실히 옴
  i.hidden = true; document.body.append(i);
  i.onchange = () => { res(i.files[0]); i.remove(); };
  i.oncancel = () => { res(); i.remove(); }; // 선택창 취소 시 버튼 잠김 방지
  i.click();
});

async function load() {
  const week = new Date(Date.now() - 7 * 864e5).toISOString();
  const [p, w, c, s, n, cn, wt, pk, ch] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('workouts').select('*').order('created_at', { ascending: false }),
    sb.from('comments').select('*').order('created_at'),
    sb.from('settings').select('fine').single(),
    sb.from('notices').select('*').gte('created_at', week).order('created_at', { ascending: false }),
    sb.rpc('can_notice'),
    sb.from('weights').select('*').order('created_at'),
    sb.from('pokes').select('*').gte('created_at', new Date(Date.now() - 2 * 864e5).toISOString()).order('created_at', { ascending: false }),
    sb.from('chat').select('*').order('created_at', { ascending: false }).limit(200), // ponytail: 최근 200개만
  ]);
  chatMsgs = check(ch).reverse();
  profiles = check(p); workouts = check(w); comments = check(c); fine = check(s).fine;
  notices = check(n); canNotice = check(cn); weights = check(wt); pokes = check(pk);
  me = profiles.find(x => x.id === me.id) ?? { id: me.id };
}
const statsOf = p => summarize(workouts.filter(w => w.user_id === p.id && w.approved_by), p.created_at);

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  me = { id: session.user.id };
  await load();
  if (!me.nickname) return nicknameView();
  $('#nav').hidden = false;
  route();
  popNotice();
  if (!boot.live) { boot.live = true; subscribeLive(); }
}

const seenGet = k => { try { return +localStorage.getItem(k) || 0; } catch { return 0; } };
const seenSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function showPop(label, body, btn, onClose) {
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = `<div role="dialog" aria-label="알림"><p class="muted">${label}</p><p class="body">${body}</p><button>${btn}</button></div>`;
  el.querySelector('button').onclick = () => { el.remove(); onClose(); };
  document.body.append(el);
}
// 공지: 화면 전체를 덮었다가 스르르 사라짐 (누르면 바로 넘김)
function showCover(from, body, onClose) {
  const el = document.createElement('div');
  el.className = 'cover'; el.setAttribute('role', 'alert');
  el.innerHTML = `<p class="from">${from}</p><p class="body">${body}</p><p class="skip">누르면 넘어가요</p>`;
  let done = false;
  const close = () => { if (done) return; done = true; el.remove(); onClose(); };
  el.onanimationend = close; el.onclick = close;
  document.body.append(el);
}
// 안 본 공지(모두에게, 보낸 사람 제외) 먼저, 없으면 나를 찌른 콕
function popNotice() {
  const n = notices.find(n => n.id > seenGet('seenNotice') && n.user_id !== me.id);
  if (n) return showCover(`📢 ${esc(nick(n.user_id))}${prof(n.user_id)?.is_admin ? ' (관리자)' : ''} → ${n.target ? (n.target === me.id ? '너' : esc(nick(n.target))) : '전체'}`,
    esc(n.body), () => { seenSet('seenNotice', notices[0].id); popNotice(); });
  const mine = pokes.filter(p => p.to_id === me.id && p.id > seenGet('seenPoke'));
  if (mine.length) showPop(`👉 ${mine.map(p => esc(nick(p.from_id))).join(', ')}`, '운동하래요', '운동하러 가기',
    () => { seenSet('seenPoke', mine[0].id); location.hash = 'go'; });
}

function noticeSection() {
  return `<div class="card"><h2>😈</h2>
    ${notices.slice(0, 5).map(n => `<div class="notice"><span class="muted">${esc(nick(n.user_id))} → <span class="to">${n.target ? esc(nick(n.target)) : '전체'}</span> · ${hhmm(n.created_at)}</span>
      <p class="body">${esc(n.body)}</p>${n.user_id === me.id ? `<button class="x" data-del="${n.id}" aria-label="지우기">✕</button>` : ''}</div>`).join('') || '<p class="muted">이번 주 조용하네</p>'}
    ${canNotice ? `<form id="noticeForm" style="margin-top:10px">
        <select id="nTarget" aria-label="받는 사람"><option value="">전체</option>${profiles.filter(p => p.id !== me.id).map(p => `<option value="${p.id}">${esc(p.nickname)}</option>`).join('')}</select>
        <input id="nBody" maxlength="80" placeholder="예: 에몽가 돼지 공부좀 해라 ㅋㅋ" required>
        <button class="ghost">😈</button></form>`
      : '<p class="muted">지난주 3회 채운 사람만 쓸 수 있어요. 억울하면 운동하기</p>'}</div>`;
}
function bindNotice(rerender) {
  app.querySelectorAll('[data-del]').forEach(x => x.onclick = act(async () => {
    check(await sb.from('notices').delete().eq('id', +x.dataset.del)); await load(); rerender(); toast('지웠어요');
  }));
  const f = $('#noticeForm'); if (!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    act(async () => {
      check(await sb.from('notices').insert({ target: $('#nTarget').value || null, body: $('#nBody').value.trim() }));
      await load(); rerender(); toast('😈');
    })({ currentTarget: f.querySelector('button') });
  };
}

function loginView() {
  $('#nav').hidden = true;
  app.innerHTML = `<h1 style="text-align:center;font-size:44px;margin-top:40px">오운완 💪</h1>
    <p class="muted" style="text-align:center;margin-top:-8px">주 3회, 같이 운동하자</p>
    <form class="card" id="loginForm">
    <input id="email" type="email" placeholder="이메일" autocomplete="email" required>
    <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" required>
    <button id="login">로그인</button><p></p>
    <button type="button" class="ghost" id="signup">회원가입</button>
    <p class="muted" style="text-align:center">비밀번호를 잊었으면 관리자에게 말해주세요. 임시 비밀번호로 바꿔줘요.</p></form>`;
  const cred = () => ({ email: $('#email').value.trim(), password: $('#pw').value });
  const login = act(async () => { check(await sb.auth.signInWithPassword(cred())); await boot(); });
  $('#loginForm').onsubmit = e => { e.preventDefault(); login({ currentTarget: $('#login') }); };
  $('#signup').onclick = act(async () => {
    const r = check(await sb.auth.signUp(cred()));
    if (!r.session) throw new Error('Supabase에서 이메일 인증(Confirm email)을 꺼주세요');
    await boot();
  });
}

function nicknameView() {
  app.innerHTML = `<h1>닉네임 정하기</h1><div class="card">
    <input id="nick" placeholder="닉네임" maxlength="12"><button id="save">시작하기</button></div>`;
  $('#save').onclick = act(async () => {
    const nickname = $('#nick').value.trim();

// 몸무게 꺾은선 그래프 (목표는 점선)
function spark(vals, target) {
  const all = target ? [...vals, target] : vals;
  const min = Math.min(...all) - 1, max = Math.max(...all) + 1;
  const x = i => vals.length === 1 ? 150 : 12 + i * 276 / (vals.length - 1);
  const y = v => 64 - (v - min) / (max - min) * 54;
  return `<svg viewBox="0 0 300 74" class="spark" role="img" aria-label="몸무게 변화 그래프">
    ${target ? `<line x1="0" x2="300" y1="${y(target)}" y2="${y(target)}" stroke="#ff8fab" stroke-width="2" stroke-dasharray="5 5"/>` : ''}
    <polyline points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="#a98bf5" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#fff" stroke="#a98bf5" stroke-width="2.5"/>`).join('')}</svg>`;
}
const ongoingOf = id => workouts.find(w => w.user_id === id && !w.end_photo && new Date(w.created_at) >= weekStart(new Date()));

         <span class="tag">${diff > 0 ? '+' : ''}${diff}kg</span></div>${spark(kg, target)}

    <div class="card"><h2>같이 운동 많이 한 친구</h2>${bud

function go() {

  const ongoing = ongoingOf(me.id);

// 시작/끝 사진 한 장 = 스냅 카드 한 장
function snap(w, end) {
  const t = end ? (w.ended_at ?? w.created_at) : w.created_at;
  return `<article class="snap ${end ? 'r' : 'l'}"><img src="${esc(end ? w.end_photo : w.start_photo)}" loading="lazy" alt="">
    <div class="ov"><span class="nm">${ava(prof(w.user_id), 'sm')}${esc(nick(w.user_id))}</span>
      <b class="tm">${hhmm(t)}</b><span class="cap">${KIND[w.kind]} ${end ? '끝 🔥' : '시작 💪'}</span></div>
    ${!end && !w.end_photo ? '<span class="badge">운동 중…</span>' : ''}
    <button class="rp" data-reply="${w.id}:${end ? 1 : 0}" aria-label="이 사진에 답장">↩</button></article>`;
}
const photoOf = (w, end) => end ? w.end_photo : w.start_photo;

// 단체방: 로그(카드) / 채팅 전환 (셋로그 방식)
let feedMode = (() => { try { return localStorage.getItem('feedMode') || 'log'; } catch { return 'log'; } })();
let replyTo = null; // {w, end}
function feed() {
  const seg = `<div class="seg"><button class="${feedMode === 'log' ? 'on' : ''}" data-mode="log">로그</button><button class="${feedMode === 'chat' ? 'on' : ''}" data-mode="chat">채팅</button></div>`;
  feedMode === 'chat' ? chatView(seg) : logView(seg);
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    feedMode = b.dataset.mode; try { localStorage.setItem('feedMode', feedMode); } catch {}
    feed();
  });
  app.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => {
    const [id, end] = b.dataset.reply.split(':');
    replyTo = { w: workouts.find(w => w.id === +id), end: end === '1' };
    feedMode = 'chat'; feed(); $('#chatIn')?.focus();
  });
}

function chatView(seg) {
  // 운동 사진(시작/끝)은 자동으로 채팅에 사진 메시지로 섞임
  const ev = [
    ...workouts.slice(0, 40).flatMap(w => [
      { t: w.created_at, uid: w.user_id, w, end: false },
      ...(w.end_photo ? [{ t: w.ended_at ?? w.created_at, uid: w.user_id, w, end: true }] : []),
    ]),
    ...chatMsgs.map(m => ({ t: m.created_at, uid: m.user_id, m })),
  ].sort((a, b) => new Date(a.t) - new Date(b.t));
  let lastDay = '', html = '<h1>단체방</h1>' + seg + '<div class="chat">';
  for (const e of ev) {
    const d = dayLabel(e.t);
    if (d !== lastDay) { html += `<div class="day">${d}</div>`; lastDay = d; }
    const mine = e.uid === me.id;
    let inner;
    if (e.w) {
      inner = `<div class="ph"><img src="${esc(photoOf(e.w, e.end))}" loading="lazy" alt="${KIND[e.w.kind]} 사진"><span>${KIND[e.w.kind]} ${e.end ? '끝' : '시작'}</span>
        <button class="rp" data-reply="${e.w.id}:${e.end ? 1 : 0}" aria-label="이 사진에 답장">↩</button></div>`;
    } else {
      const rw = e.m.workout_id && workouts.find(w => w.id === e.m.workout_id);
      inner = `<div class="bub">${rw ? `<div class="quote"><img src="${esc(photoOf(rw, e.m.photo_end))}" alt=""><span>${esc(nick(rw.user_id))} ${KIND[rw.kind]} ${e.m.photo_end ? '끝' : '시작'}</span></div>` : ''}${esc(e.m.body)}</div>`;
    }
    html += `<div class="msg ${mine ? 'mine' : ''}">${mine ? '' : ava(prof(e.uid), 'sm')}
      <div>${mine ? '' : `<p class="who-s">${esc(nick(e.uid))}</p>`}${inner}</div><span class="time">${hhmm(e.t)}</span></div>`;
  }
  html += `</div><form class="chatbar" id="chatForm">
    ${replyTo ? `<div class="replying"><img src="${esc(photoOf(replyTo.w, replyTo.end))}" alt="">${esc(nick(replyTo.w.user_id))} 사진에 답장<button type="button" class="x" id="noReply" aria-label="답장 취소">✕</button></div>` : ''}
    <div class="row"><input id="chatIn" maxlength="300" placeholder="메시지" autocomplete="off" required><button aria-label="보내기">↑</button></div></form>`;
  app.innerHTML = html;
  window.scrollTo(0, document.body.scrollHeight);
  $('#noReply') && ($('#noReply').onclick = () => { replyTo = null; feed(); });
  $('#chatForm').onsubmit = e => {
    e.preventDefault();
    act(async () => {
      const body = $('#chatIn').value.trim(); if (!body) return;
      check(await sb.from('chat').insert({ body, workout_id: replyTo?.w.id ?? null, photo_end: replyTo ? replyTo.end : null }));
      replyTo = null; await load(); feed(); $('#chatIn')?.focus();
    })({ currentTarget: $('#chatForm button[aria-label="보내기"]') });
  };
}

// 새 채팅/운동 사진 실시간 반영 (단체방 보고 있을 때만 다시 그림, 쓰던 글은 유지)
function subscribeLive() {
  sb.channel('live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'chat' }, refreshLive)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'workouts' }, refreshLive)
    .subscribe();
}
async function refreshLive() {
  await load();
  if (location.hash !== '#feed') return;
  const draft = $('#chatIn')?.value, focused = document.activeElement?.id === 'chatIn';
  feed();
  if (draft && $('#chatIn')) $('#chatIn').value = draft;
  if (focused) $('#chatIn')?.focus();
}
// 끝 카드 아래: 확인(👍) + 한마디
function reactBox(w) {
  const cs = comments.filter(c => c.workout_id === w.id);
  return `<div class="react">
    ${!w.end_photo ? `<p class="muted">운동 중… 끝 사진 올라오면 확인 가능</p>`
      : w.approved_by ? `<p class="ok"><b>👍 ${esc(nick(w.approved_by))} 확인 완료</b></p>`
      : w.user_id === me.id ? `<p class="muted">친구 확인 기다리는 중…</p>`
      : `<button class="yel small" data-ok="${w.id}">👍 확인해주기</button>`}
    ${cs.map(c => `<p><b>${esc(nick(c.user_id))}</b> ${esc(c.body)}</p>`).join('')}
    <form data-cmt="${w.id}"><input maxlength="60" placeholder="한마디 남기기" required><button>↑</button></form></div>`;
}

function logView(seg) {
  // ponytail: 최근 30개 운동만, 무한 스크롤은 필요해지면
  const ev = workouts.slice(0, 30).flatMap(w => [
    { w, end: false, t: w.created_at },
    ...(w.end_photo ? [{ w, end: true, t: w.ended_at ?? w.created_at }] : []),
  ]).sort((a, b) => new Date(b.t) - new Date(a.t));
  let lastDay = '', html = '<h1>단체방</h1>' + seg;
  for (const e of ev) {
    const d = dayLabel(e.t);
    if (d !== lastDay) { html += `<div class="day">${d}</div>`; lastDay = d; }
    // 끝 카드 밑에 반응, 아직 운동 중이면 시작 카드 밑에
    html += snap(e.w, e.end) + (e.end || !e.w.end_photo ? reactBox(e.w) : '<div style="height:22px"></div>');
  }
  app.innerHTML = ev.length ? html : html + '<p class="muted">아직 인증이 없어요. 첫 오운완 올려봐요!</p>';
  bindReact(feed);
}
function bindReact(rerender) {
  app.querySelectorAll('[data-ok]').forEach(b => b.onclick = act(async () => {
    check(await sb.rpc('approve', { wid: +b.dataset.ok })); await load(); rerender();
  }));
  app.querySelectorAll('[data-cmt]').forEach(f => f.onsubmit = e => {
    e.preventDefault();
    act(async () => {
      check(await sb.from('comments').insert({ workout_id: +f.dataset.cmt, body: f.querySelector('input').value.trim() }));
      await load(); rerender();
    })({ currentTarget: f.querySelector('button') });
  });
}

    toast('올리는 중…');
    const r = check(await sb.from('profiles').update({ avatar: await upload(f) }).eq('id', me.id).select('id'));
    if (!r.length) throw new Error('프사 저장 실패. 다시 로그인해봐요');
    await load(); mePage();
  });
  $('#wphoto').onclick = act(async () => {
    const f = await pickPhoto(); if (!f) return;
    toast('올리는 중…');
    check(await sb.from('profiles').update({ weight_photo: await upload(f) }).eq('id', me.id));
    await load(); mePage();
  });
  $('#save').onclick = act(async () => {
    const cw = num($('#cw').value);
    check(await sb.from('profiles').update({ nickname: $('#nick').value.trim() || me.nickname, target_weight: num($('#tw').value), current_weight: cw }).eq('id', me.id));
    // 몸무게 바뀌면 그래프용 기록 추가
    if (cw && cw !== +me.current_weight) check(await sb.from('weights').insert({ kg: cw }));
    await load(); toast('저장됨');
  });
  $('#changePw').onclick = act(async () => {
    check(await sb.auth.updateUser({ password: $('#newPw').value }));
    $('#newPw').value = ''; toast('비밀번호 바뀜');
  });
  $('#logout').onclick = act(async () => { await sb.auth.signOut(); boot(); });
}

boot().catch(e => { app.innerHTML = `<p class="warn">${esc(e.message)}</p><p class="muted">Supabase 설정(SUPABASE_URL/KEY, schema.sql) 확인</p>`; });
</script>
</body>
</html>
