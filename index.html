<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>오운완</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e37;--text:#eef0f3;--sub:#9aa1ad;--acc:#c6f24e;--warn:#ff7a59}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:8px 0 16px}
h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:44px;font-weight:800;color:var(--acc);line-height:1.1}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:20px}
button{background:var(--acc);color:#111;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.small{width:auto;padding:8px 12px;font-size:13px}
button:disabled{opacity:.5}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b0d11;color:var(--text);font-size:16px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.pics img,.pics div{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#0b0d11}
.pics div{display:grid;place-items:center;color:var(--sub);font-size:13px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--line)}
.ok{color:var(--acc)}.warn{color:var(--warn)}.muted{color:var(--sub);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav a{flex:1;text-align:center;padding:14px 0;color:var(--sub);text-decoration:none;font-size:13px}
nav a.on{color:var(--acc);font-weight:700}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);display:inline-grid;place-items:center;font-weight:700;flex:none}
.ava.lg{width:88px;height:88px;font-size:32px}
.who{display:flex;gap:10px;align-items:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%}
</style>
</head>
<body>
<main id="app"><p class="muted">불러오는 중…</p></main>
<nav id="nav" hidden>
  <a href="#home">홈</a><a href="#feed">인증</a><a href="#members">멤버</a><a href="#me">내 정보</a>
</nav>
<div id="toast"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';
import { summarize, weekStart } from './rules.js';

// Supabase > Settings > API Keys 의 publishable 키 (브라우저 공개용, RLS로 보호)
const SUPABASE_URL = 'https://ihbwffqdhjhjnwtyytsm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xM4r7niqDRbcb40AXIMHAg_xjHV0ZXp';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const won = n => n.toLocaleString('ko-KR') + '원';
const KIND = { cardio: '유산소', strength: '근력' };
let me, profiles = [], workouts = [], fine = 10000;

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2500);
}
const nick = id => profiles.find(p => p.id === id)?.nickname ?? '?';
const ava = (p, cls = '') => p?.avatar
  ? `<img class="ava ${cls}" src="${esc(p.avatar)}" alt="">`
  : `<span class="ava ${cls}">${esc((p?.nickname ?? '?')[0])}</span>`;
const who = id => { const p = profiles.find(x => x.id === id); return `<span class="who">${ava(p)}<b>${esc(p?.nickname ?? '?')}</b></span>`; };
const check = r => { if (r.error) throw r.error; return r.data; };
// 버튼 액션 공통: 실패하면 토스트
const act = fn => async e => {
  const b = e?.currentTarget; if (b) b.disabled = true;
  try { await fn(); } catch (err) { toast(err.message ?? String(err)); } finally { if (b) b.disabled = false; }
};

// 사진 리사이즈(긴 변 1280) 후 업로드, 공개 URL 반환
async function upload(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), { width: img.width * s, height: img.height * s });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  const path = `${me.id}/${crypto.randomUUID()}.jpg`;
  check(await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' }));
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
}
// camera=true: 폰에서 바로 카메라 (운동 인증용), false: 앨범 선택 허용
const pickPhoto = (camera = true) => new Promise(res => {
  const i = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' });
  if (camera) i.setAttribute('capture', 'environment');
  i.onchange = () => res(i.files[0]);
  i.click();
});

async function load() {
  const [p, w, s] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('workouts').select('*').order('created_at', { ascending: false }),
    sb.from('settings').select('fine').single(),
  ]);
  profiles = check(p); workouts = check(w); fine = check(s).fine;
  me = profiles.find(x => x.id === me.id) ?? { id: me.id };
}
const statsOf = p => summarize(workouts.filter(w => w.user_id === p.id && w.approved_by), p.created_at);

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  me = { id: session.user.id };
  await load();
  if (!me.nickname) return nicknameView();
  $('#nav').hidden = false;
  route();
}

function loginView() {
  $('#nav').hidden = true;
  app.innerHTML = `<h1>오운완 💪</h1><div class="card">
    <input id="email" type="email" placeholder="이메일" autocomplete="email">
    <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <button id="login">로그인</button><p></p>
    <button class="ghost" id="signup">회원가입</button></div>`;
  const cred = () => ({ email: $('#email').value.trim(), password: $('#pw').value });
  $('#login').onclick = act(async () => { check(await sb.auth.signInWithPassword(cred())); await boot(); });
  $('#signup').onclick = act(async () => {
    const r = check(await sb.auth.signUp(cred()));
    if (!r.session) throw new Error('Supabase에서 이메일 인증(Confirm email)을 꺼주세요');
    await boot();
  });
}

function nicknameView() {
  app.innerHTML = `<h1>닉네임 정하기</h1><div class="card">
    <input id="nick" placeholder="닉네임" maxlength="12"><button id="save">시작하기</button></div>`;
  $('#save').onclick = act(async () => {
    const nickname = $('#nick').value.trim();
    if (!nickname) throw new Error('닉네임을 입력해주세요');
    check(await sb.from('profiles').insert({ id: me.id, nickname }));
    await boot();
  });
}

function route() {
  const page = location.hash.slice(1) || 'home';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + page));
  ({ home, feed, members, me: mePage }[page] ?? home)();
}
window.onhashchange = route;

function home() {
  const s = statsOf(me);
  const thisWeek = weekStart(new Date());
  const mine = workouts.filter(w => w.user_id === me.id && new Date(w.created_at) >= thisWeek);
  const ongoing = mine.find(w => !w.end_photo);
  const pending = mine.filter(w => w.end_photo && !w.approved_by).length;
  const toApprove = workouts.filter(w => w.user_id !== me.id && w.end_photo && !w.approved_by).length;
  app.innerHTML = `<h1 class="who">${ava(me)}${esc(me.nickname)}님, 오운완?</h1>
    <div class="card"><h2>이번 주</h2>
      <div class="big">${s.week.left ? `${s.week.left}회 남았어요` : '완료 🎉'}</div>
      <p class="muted">유산소 ${s.week.cardio}/1 · 근력 ${s.week.strength}/2${pending ? ` · 확인 대기 ${pending}` : ''}</p></div>
    <div class="card">${ongoing
      ? `<h2>운동 중 (${KIND[ongoing.kind]})</h2><div class="pics"><img src="${esc(ongoing.start_photo)}"><div>끝 사진</div></div>
         <button id="finish">운동 끝 사진 찍기</button><p></p><button class="ghost small" id="cancel">취소</button>`
      : `<h2>운동 시작</h2><select id="kind"><option value="strength">근력</option><option value="cardio">유산소</option></select>
         <button id="start">시작 사진 찍기</button>`}</div>
    <div class="grid3 card">
      <div><b>${s.couponsLeft}/3</b><span class="muted">분기 쿠폰</span></div>
      <div><b class="${s.misses ? 'warn' : ''}">${won(s.misses * fine)}</b><span class="muted">내 벌금</span></div>
      <div><b>${toApprove}</b><span class="muted">확인 요청</span></div>
    </div>
    ${toApprove ? `<button class="ghost" onclick="location.hash='feed'">친구 인증 확인하러 가기</button>` : ''}`;
  if (ongoing) {
    $('#finish').onclick = act(async () => {
      const f = await pickPhoto(); if (!f) return;
      toast('올리는 중…');
      check(await sb.from('workouts').update({ end_photo: await upload(f) }).eq('id', ongoing.id));
      toast('인증 완료! 친구 확인 기다리는 중'); await load(); home();
    });
    $('#cancel').onclick = act(async () => {
      check(await sb.from('workouts').delete().eq('id', ongoing.id)); await load(); home();
    });
  } else {
    $('#start').onclick = act(async () => {
      const kind = $('#kind').value, f = await pickPhoto(); if (!f) return;
      toast('올리는 중…');
      check(await sb.from('workouts').insert({ kind, start_photo: await upload(f) }));
      toast('화이팅! 끝나면 끝 사진 찍기'); await load(); home();
    });
  }
}

function feed() {
  const list = workouts.filter(w => w.end_photo).slice(0, 50); // ponytail: 최근 50개만, 페이지네이션은 필요해지면
  app.innerHTML = `<h1>인증</h1>` + (list.map(w => `<div class="card">
    <div class="row">${who(w.user_id)}<span class="tag">${KIND[w.kind]}</span></div>
    <p class="muted">${new Date(w.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' })}</p>
    <div class="pics"><img src="${esc(w.start_photo)}" loading="lazy"><img src="${esc(w.end_photo)}" loading="lazy"></div>
    ${w.approved_by ? `<span class="ok">✓ ${esc(nick(w.approved_by))} 확인</span>`
      : w.user_id === me.id ? `<span class="muted">확인 기다리는 중</span>`
      : `<button data-id="${w.id}">확인해주기 👍</button>`}</div>`).join('') || '<p class="muted">아직 인증이 없어요</p>');
  app.querySelectorAll('button[data-id]').forEach(b => b.onclick = act(async () => {
    check(await sb.rpc('approve', { wid: +b.dataset.id })); await load(); feed();
  }));
}

function members() {
  const rows = profiles.map(p => ({ p, s: statsOf(p) }));
  const pot = rows.reduce((a, r) => a + r.s.misses * fine, 0);
  app.innerHTML = `<h1>멤버</h1>
    <div class="card"><h2>벌금통</h2><div class="big">${won(pot)}</div><p class="muted">미달 1회당 ${won(fine)}</p></div>
    ${rows.map(({ p, s }) => `<div class="card"><div class="row">${who(p.id)}
      <span class="${s.week.left ? '' : 'ok'}">${s.week.left ? `이번 주 ${s.week.left}회 남음` : '이번 주 완료'}</span></div>
      <p class="muted">유산소 ${s.week.cardio}/1 · 근력 ${s.week.strength}/2 · 쿠폰 ${s.couponsLeft}/3 · 벌금 <span class="${s.misses ? 'warn' : ''}">${won(s.misses * fine)}</span>
      ${p.current_weight ? ` · ${p.current_weight}kg${p.target_weight ? ` → ${p.target_weight}kg` : ''}` : ''}</p></div>`).join('')}
    ${me.is_admin ? `<div class="card"><h2>관리자: 벌금 금액</h2><input id="fine" type="number" step="1000" value="${fine}"><button id="saveFine">저장</button></div>` : ''}`;
  if (me.is_admin) $('#saveFine').onclick = act(async () => {
    check(await sb.from('settings').update({ fine: +$('#fine').value }).eq('id', 1));
    await load(); members(); toast('저장됨');
  });
}

function mePage() {
  app.innerHTML = `<h1>내 정보</h1><div class="card">
    <div style="text-align:center;margin-bottom:12px">${ava(me, 'lg')}<p></p>
      <button class="ghost small" id="avatar">프로필 사진 바꾸기</button></div>
    <label>닉네임</label><input id="nick" value="${esc(me.nickname)}" maxlength="12">
    <label>목표 체중 (kg)</label><input id="tw" type="number" step="0.1" value="${me.target_weight ?? ''}">
    <label>현재 체중 (kg)</label><input id="cw" type="number" step="0.1" value="${me.current_weight ?? ''}">
    <label>체중계 사진</label>
    ${me.weight_photo ? `<img src="${esc(me.weight_photo)}" style="width:100%;border-radius:10px;margin-bottom:10px">` : ''}
    <button class="ghost" id="wphoto">체중계 사진 찍기</button><p></p>
    <button id="save">저장</button></div>
    <button class="ghost" id="logout">로그아웃</button>`;
  const num = v => v === '' ? null : +v;
  $('#avatar').onclick = act(async () => {
    const f = await pickPhoto(false); if (!f) return;
    toast('올리는 중…');
    check(await sb.from('profiles').update({ avatar: await upload(f) }).eq('id', me.id));
    await load(); mePage();
  });
  $('#wphoto').onclick = act(async () => {
    const f = await pickPhoto(); if (!f) return;
    toast('올리는 중…');
    check(await sb.from('profiles').update({ weight_photo: await upload(f) }).eq('id', me.id));
    await load(); mePage();
  });
  $('#save').onclick = act(async () => {
    check(await sb.from('profiles').update({ nickname: $('#nick').value.trim() || me.nickname, target_weight: num($('#tw').value), current_weight: num($('#cw').value) }).eq('id', me.id));
    await load(); toast('저장됨');
  });
  $('#logout').onclick = act(async () => { await sb.auth.signOut(); boot(); });
}

boot().catch(e => { app.innerHTML = `<p class="warn">${esc(e.message)}</p><p class="muted">Supabase 설정(SUPABASE_URL/KEY, schema.sql) 확인</p>`; });
</script>
</body>
</html>
